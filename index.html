    <title>ردیاب علمی عادات روزانه (Lally 2010)</title>
    <meta name="description" content="سامانه هوشمند و علمی ردیابی عادات روزانه با محاسبه درصد خودکارشدگی (Automaticity Score) بر اساس منحنی نمایی لالی و همکاران (۲۰۱۰) و ذخیره‌سازی در حافظه مرورگر." />
    <meta property="og:title" content="ردیاب علمی عادات روزانه (Lally 2010)" />
    <meta property="og:description" content="سامانه هوشمند و علمی ردیابی عادات روزانه با محاسبه درصد خودکارشدگی (Automaticity Score) بر اساس منحنی نمایی لالی و همکاران (۲۰۱۰) و ذخیره‌سازی در حافظه مرورگر." />
    <script>
      (function() {
        var suppressSecurityError = function(e) {
          try {
            var msg = (e && (e.message || (e.reason && (e.reason.message || e.reason)))) || '';
            var strMsg = String(msg);
            if (
              strMsg.indexOf('cross-origin') !== -1 ||
              strMsg.indexOf('Blocked a frame') !== -1 ||
              strMsg.indexOf('SecurityError') !== -1 ||
              strMsg.indexOf('Protocols, domains, and ports must match') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.stopPropagation) e.stopPropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          } catch (err) {}
        };
        window.addEventListener('error', suppressSecurityError, true);
        window.addEventListener('unhandledrejection', suppressSecurityError, true);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
